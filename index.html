<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dra. Betty</title>
<meta name="description" content="Tus gastos, ahorros y colchón de emergencias, con la Dra. Betty.">
<meta name="theme-color" content="#0D1028">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dra. Betty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Fondo: imágenes que se van alternando -->
<div id="fondo" aria-hidden="true">
  <div class="fondo-img" id="fondo-a"></div>
  <div class="fondo-img" id="fondo-b"></div>
  <div class="fondo-velo"></div>
</div>

<header class="top" id="top" hidden>
  <div class="wrap">
    <div class="top-in">
      <div class="brand"><img src="icons/icon-192.png" alt="" width="30" height="30">Dra. <i>Betty</i></div>
      <button class="icono" id="sig-fondo" aria-label="Cambiar imagen de fondo" title="Cambiar fondo">🖼</button>
      <button class="icono" id="btn-ajustes" aria-label="Ajustes" title="Ajustes">⚙</button>
      <div class="mes" id="mes-sel">
        <button id="mprev" aria-label="Mes anterior">‹</button>
        <b id="mlbl">—</b>
        <button id="mnext" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="inicio" aria-current="true"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></span>Inicio</button>
      <button data-tab="movs"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span>Movimientos</button>
      <button data-tab="pagos"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8.5 14.5l2.2 2.2 4.8-4.8"/></svg></span>Pagos</button>
      <button data-tab="graficas"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></span>Gráficas</button>
      <button data-tab="cuentas"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18v12H3z"/><path d="M3 8l2-4h14l2 4"/><circle cx="16.5" cy="14" r="1.5"/></svg></span>Cuentas</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <main id="app">
    <div class="arranque">
      <div class="brand big">Dra. <i>Betty</i></div>
      <p class="sub">Abriendo…</p>
    </div>
  </main>
</div>

<button class="fab" id="fab" aria-label="Anotar algo" hidden>+</button>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;color:#F3F1FA">La Dra. Betty necesita JavaScript activado.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
